; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TTGO T-Beam 多版本支持配置
; 使用方法：
;   - 编译默认版本: pio run -e ttgo-t-beam
;   - 编译V0.7版本: pio run -e ttgo-t-beam-v0_7
;   - 编译V1.0版本: pio run -e ttgo-t-beam-v1_0
;   - 编译V1.1版本: pio run -e ttgo-t-beam-v1_1
;   - 编译V1.2版本: pio run -e ttgo-t-beam-v1_2
;   - 编译V2.0版本: pio run -e ttgo-t-beam-v2_0
;   - 上传对应版本: pio run -e [环境名] --target upload

; 通用环境配置 - 所有版本共用的配置
[env]
platform = espressif32
board = ttgo-t-beam
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
	Adafruit BusIO
	RadioHead
	TinyGPSPlus
	Adafruit SSD1306
	Adafruit GFX Library
	AXP202X_Library
	OneWire
	OneButton

; 默认环境 - V1.0版本
[env:ttgo-t-beam]
extends = env
build_flags = -DT_BEAM_V1_0

; TTGO T-Beam V0.7 版本配置
[env:ttgo-t-beam-v0_7]
extends = env
build_flags = -DT_BEAM_V0_7

; TTGO T-Beam V1.0 版本配置
[env:ttgo-t-beam-v1_0]
extends = env
build_flags = -DT_BEAM_V1_0

; TTGO T-Beam V1.1 版本配置
[env:ttgo-t-beam-v1_1]
extends = env
build_flags = -DT_BEAM_V1_1

; TTGO T-Beam V1.2 版本配置
[env:ttgo-t-beam-v1_2]
extends = env
build_flags = -DT_BEAM_V1_2

; TTGO T-Beam V2.0 版本配置
[env:ttgo-t-beam-v2_0]
extends = env
build_flags = -DT_BEAM_V2_0
